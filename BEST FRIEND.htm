<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Proposal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', sans-serif;
            position: relative;
        }

        /* --- ব্যাকগ্রাউন্ডে হার্ট পড়ার অ্যানিমেশন --- */
        .heart-bg {
            position: absolute;
            top: -10%;
            font-size: 20px;
            color: #ff3366;
            opacity: 0.7;
            animation: fall 4s linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(110vh) translateX(50px) rotate(360deg);
                opacity: 0;
            }
        }

        /* আলাদা আলাদা হার্টের পজিশন ও টাইমিং */
        .h1 { left: 10%; animation-delay: 0s; }
        .h2 { left: 25%; animation-delay: 1s; animation-duration: 5s; }
        .h3 { left: 40%; animation-delay: 0.5s; }
        .h4 { left: 55%; animation-delay: 1.5s; animation-duration: 6s; }
        .h5 { left: 70%; animation-delay: 2s; }
        .h6 { left: 85%; animation-delay: 0.8s; animation-duration: 4.5s; }

        /* --- টেক্সট এবং কাউন্টডাউন অ্যানিমেশন --- */
        .text-animation {
            position: absolute;
            font-size: 70px;
            color: #fff;
            text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366, 0 0 40px #ff3366;
            opacity: 0;
            transform: scale(0.5);
            animation: showText 1.2s ease-in-out forwards;
        }

        @keyframes showText {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.2); }
        }

        /* প্রতিটি লেখার আসার সময় (Delay) */
        .count3 { animation-delay: 0.5s; }
        .count2 { animation-delay: 1.8s; }
        .count1 { animation-delay: 3.1s; }
        .word1  { animation-delay: 4.4s; }
        .word2  { animation-delay: 5.7s; }
        .word3  { animation-delay: 7s; }
        .word4  { animation-delay: 8.3s; }

        /* --- শেষ নিয়ন হার্ট বক্স --- */
        .final-box {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: showFinal 1.5s ease-in-out forwards;
            animation-delay: 10s; /* সব টেক্সট শেষ হওয়ার পর আসবে */
        }

        @keyframes showFinal {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* নিয়ন হার্ট শেপ */
        .neon-heart {
            width: 150px;
            height: 150px;
            background-color: #ff3366;
            position: relative;
            transform: rotate(-45deg);
            box-shadow: 0 0 20px #ff3366, 0 0 40px #ff3366, 0 0 60px #ff3366;
            animation: pulse 1.2s infinite alternate;
        }

        .neon-heart::before,
        .neon-heart::after {
            content: '';
            width: 150px;
            height: 150px;
            background-color: #ff3366;
            border-radius: 50%;
            position: absolute;
        }

        .neon-heart::before {
            top: -75px;
            left: 0;
        }

        .neon-heart::after {
            top: 0;
            left: 75px;
        }

        /* হার্ট বিট বা পালস অ্যানিমেশন */
        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(1); }
            100% { transform: rotate(-45deg) scale(1.1); }
        }

        /* হার্টের ভেতরের টেক্সট */
        .love-text {
            position: absolute;
            z-index: 10;
            font-size: 24px;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 5px #000;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="heart-bg h1">❤</div>
    <div class="heart-bg h2">❤</div>
    <div class="heart-bg h3">💖</div>
    <div class="heart-bg h4">❤</div>
    <div class="heart-bg h5">💖</div>
    <div class="heart-bg h6">❤</div>

    <div class="text-animation count3">3</div>
    <div class="text-animation count2">2</div>
    <div class="text-animation count1">1</div>
    
    <div class="text-animation word1">YOU</div>
    <div class="text-animation word2">ARE</div>
    <div class="text-animation word3">MY</div>
    <div class="text-animation word4">FAST BEST FRIEND</div>

    <div class="final-box">
        <div class="neon-heart"></div>
        <div class="love-text">
             Love You <br>
            <span style="font-size: 16px; font-weight: normal;">My best friend</span>
        </div>
    </div>

</body>
</html>
